<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - StyleMirror</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div id="site-header-container"></div>

  <main class="main-content">
    <div class="container">
      <div style="margin-bottom: 32px;">
        <span class="product-brand">CUSTOMER PURCHASE HISTORY</span>
        <h1 class="display-title" style="font-size: 2.2rem;">MY <span class="gold-text">ORDERS</span></h1>
      </div>

      <div class="data-table-card">
        <table class="data-table">
          <thead>
            <tr>
              <th>Order Number</th>
              <th>Date Placed</th>
              <th>Items</th>
              <th>Total Amount</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="orders-table-body">
            <tr>
              <td colspan="6" style="text-align: center;"><div class="loading-spinner"></div></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <script type="module">
    import { orders } from "/js/orders.js";
    import { auth } from "/js/auth.js";
    import { utils } from "/js/utils.js";
    import "/js/app.js";

    async function loadOrders() {
      const tbody = document.getElementById("orders-table-body");

      if (!auth.isLoggedIn()) {
        window.location.href = "/pages/login.html";
        return;
      }

      try {
        const orderList = await orders.getUserOrders();
        if (orderList.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-muted);">
                No orders placed yet. Browse the collection to create your first order.
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = orderList.map(o => `
          <tr>
            <td><strong>${o.orderNumber}</strong></td>
            <td>${utils.formatDate(o.createdAt)}</td>
            <td>${o.items ? o.items.length : 0} items</td>
            <td style="font-weight: 700; color: var(--accent-gold);">${utils.formatCurrency(o.totalAmount)}</td>
            <td>
              <span class="status-pill ${o.status === 'DELIVERED' ? 'success' : (o.status === 'CANCELLED' ? 'danger' : 'info')}">
                ${o.status}
              </span>
            </td>
            <td>
              <a href="/pages/order-details.html?id=${o.id}" class="btn btn-secondary btn-sm">
                Track &amp; Details
              </a>
            </td>
          </tr>
        `).join("");
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Error: ${err.message}</td></tr>`;
      }
    }

    loadOrders();
  </script>
</body>
</html>
