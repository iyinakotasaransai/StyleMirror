<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Sellers &amp; Ateliers - StyleMirror Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div id="site-header-container"></div>

  <main class="main-content">
    <div class="container">
      <div class="dashboard-header">
        <div>
          <span class="product-brand">MERCHANT OVERSIGHT</span>
          <h1 class="display-title" style="font-size: 2.2rem;">SELLER <span class="gold-text">PARTNERS</span></h1>
        </div>
        <div style="display: flex; gap: 8px;">
          <a href="/pages/admin/dashboard.html" class="btn btn-outline btn-sm">&larr; Admin Suite</a>
          <a href="/pages/admin/categories.html" class="btn btn-secondary btn-sm">Categories &rarr;</a>
        </div>
      </div>

      <!-- Filters -->
      <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;" id="seller-filter-tabs">
        <button class="btn btn-sm btn-primary filter-tab" data-filter="ALL">All Sellers</button>
        <button class="btn btn-sm btn-outline filter-tab" data-filter="PENDING">Pending Review</button>
        <button class="btn btn-sm btn-outline filter-tab" data-filter="APPROVED">Approved Stores</button>
        <button class="btn btn-sm btn-outline filter-tab" data-filter="BLOCKED">Blocked</button>
      </div>

      <div class="data-table-card">
        <table class="data-table">
          <thead>
            <tr>
              <th>Store Details</th>
              <th>Owner &amp; Account</th>
              <th>Business Address</th>
              <th>GST / Tax ID</th>
              <th>Approval Status</th>
              <th>Registered</th>
              <th>Moderation Actions</th>
            </tr>
          </thead>
          <tbody id="admin-sellers-tbody">
            <tr>
              <td colspan="7" style="text-align: center;"><div class="loading-spinner"></div></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <script type="module">
    import { admin } from "/js/admin.js";
    import { auth } from "/js/auth.js";
    import { utils } from "/js/utils.js";
    import "/js/app.js";

    let allSellers = [];
    let currentFilter = "ALL";

    async function loadSellers() {
      if (!auth.protectPage("ADMIN")) return;

      const tbody = document.getElementById("admin-sellers-tbody");
      try {
        allSellers = await admin.getSellers();
        renderFilteredSellers();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #ef4444;">Failed to load seller records: ${err.message}</td></tr>`;
      }
    }

    function renderFilteredSellers() {
      const tbody = document.getElementById("admin-sellers-tbody");
      const list = currentFilter === "ALL" 
        ? allSellers 
        : allSellers.filter(s => s.approvalStatus === currentFilter);

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 40px; color: var(--text-muted);">No sellers matching current filter (${currentFilter}).</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(s => `
        <tr>
          <td>
            <div style="font-weight: 700; color: var(--accent-gold); font-size: 1rem;">${s.storeName}</div>
            <div style="font-size: 0.78rem; color: var(--text-muted);">${s.storeDescription || 'No description provided'}</div>
          </td>
          <td>
            <div style="font-weight: 600;">${s.userName}</div>
            <div style="font-size: 0.8rem; color: var(--text-dim);">${s.email}</div>
          </td>
          <td style="font-size: 0.85rem; color: var(--text-muted);">${s.businessAddress || 'N/A'}</td>
          <td><code>${s.gstNumber || 'N/A'}</code></td>
          <td>
            <span class="status-pill ${getSellerStatusClass(s.approvalStatus)}">
              ${s.approvalStatus}
            </span>
          </td>
          <td style="font-size: 0.82rem; color: var(--text-muted);">${utils.formatDate(s.createdAt)}</td>
          <td>
            <div class="action-btns">
              ${s.approvalStatus !== 'APPROVED' ? `
                <button onclick="window.smApproveSeller(${s.id})" class="btn btn-primary btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">
                  Approve
                </button>
              ` : ''}
              ${s.approvalStatus !== 'BLOCKED' ? `
                <button onclick="window.smBlockSeller(${s.id})" class="btn btn-danger btn-sm" style="padding: 4px 10px; font-size: 0.75rem;">
                  Block
                </button>
              ` : ''}
            </div>
          </td>
        </tr>
      `).join("");
    }

    function getSellerStatusClass(status) {
      switch (status) {
        case "APPROVED": return "success";
        case "PENDING": return "warning";
        case "BLOCKED":
        case "REJECTED": return "danger";
        default: return "cyan";
      }
    }

    window.smApproveSeller = function(id) {
      admin.approveSeller(id);
    };

    window.smBlockSeller = function(id) {
      admin.blockSeller(id);
    };

    document.querySelectorAll(".filter-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".filter-tab").forEach(t => {
          t.classList.remove("btn-primary");
          t.classList.add("btn-outline");
        });
        tab.classList.remove("btn-outline");
        tab.classList.add("btn-primary");
        currentFilter = tab.dataset.filter;
        renderFilteredSellers();
      });
    });

    loadSellers();
  </script>
</body>
</html>
