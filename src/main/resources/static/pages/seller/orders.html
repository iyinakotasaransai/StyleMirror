<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Orders - StyleMirror</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div id="site-header-container"></div>

  <main class="main-content">
    <div class="container">
      <div class="dashboard-header">
        <div>
          <span class="product-brand">ORDER FULFILLMENT</span>
          <h1 class="display-title" style="font-size: 2.2rem;">BOUTIQUE <span class="gold-text">ORDERS</span></h1>
        </div>
        <div style="display: flex; gap: 10px;">
          <a href="/pages/seller/dashboard.html" class="btn btn-outline btn-sm">&larr; Studio Dashboard</a>
          <a href="/pages/seller/products.html" class="btn btn-secondary btn-sm">Manage Products</a>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;" id="order-filters">
        <button class="btn btn-sm btn-primary filter-btn" data-status="ALL">All Orders</button>
        <button class="btn btn-sm btn-outline filter-btn" data-status="PLACED">Placed</button>
        <button class="btn btn-sm btn-outline filter-btn" data-status="CONFIRMED">Confirmed</button>
        <button class="btn btn-sm btn-outline filter-btn" data-status="PROCESSING">Processing</button>
        <button class="btn btn-sm btn-outline filter-btn" data-status="SHIPPED">Shipped</button>
        <button class="btn btn-sm btn-outline filter-btn" data-status="DELIVERED">Delivered</button>
      </div>

      <div class="data-table-card">
        <table class="data-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Date &amp; Time</th>
              <th>Customer</th>
              <th>Items &amp; Details</th>
              <th>Total Amount</th>
              <th>Status</th>
              <th>Update Status</th>
            </tr>
          </thead>
          <tbody id="seller-orders-tbody">
            <tr>
              <td colspan="7" style="text-align: center;"><div class="loading-spinner"></div></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <script type="module">
    import { seller } from "/js/seller.js";
    import { auth } from "/js/auth.js";
    import { utils } from "/js/utils.js";
    import "/js/app.js";

    let allOrders = [];
    let currentFilter = "ALL";

    async function loadOrders() {
      if (!auth.protectPage("SELLER")) return;

      const tbody = document.getElementById("seller-orders-tbody");
      try {
        allOrders = await seller.getOrders();
        renderFilteredOrders();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #ef4444;">Failed to load orders: ${err.message}</td></tr>`;
      }
    }

    function renderFilteredOrders() {
      const tbody = document.getElementById("seller-orders-tbody");
      const filtered = currentFilter === "ALL" 
        ? allOrders 
        : allOrders.filter(o => o.status === currentFilter);

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-muted);">
              No boutique orders matching current filter (${currentFilter}).
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(o => `
        <tr>
          <td>
            <code>#SM-${o.id}</code>
            <div style="font-size: 0.75rem; color: var(--text-dim); margin-top: 3px;">
              ${o.paymentStatus ? `<span class="status-pill ${o.paymentStatus === 'PAID' ? 'success' : 'warning'}" style="font-size: 0.65rem; padding: 2px 6px;">${o.paymentStatus}</span>` : ''}
            </div>
          </td>
          <td style="font-size: 0.85rem; color: var(--text-muted);">${utils.formatDate(o.createdAt)}</td>
          <td>
            <div style="font-weight: 600;">${o.userName || "Customer"}</div>
            <div style="font-size: 0.78rem; color: var(--text-dim);">${o.shippingCity ? `${o.shippingCity}, ${o.shippingCountry || ''}` : ''}</div>
          </td>
          <td>
            <div style="max-width: 280px; font-size: 0.85rem;">
              ${(o.items || []).map(it => `
                <div style="margin-bottom: 4px;">
                  &bull; <strong>${it.productName}</strong> (x${it.quantity}) - ${it.variantSize}/${it.variantColor}
                </div>
              `).join("")}
            </div>
          </td>
          <td style="font-weight: 700; color: var(--accent-gold);">${utils.formatCurrency(o.totalAmount)}</td>
          <td>
            <span class="status-pill ${getStatusColorClass(o.status)}">
              ${o.status}
            </span>
          </td>
          <td>
            <div style="display: flex; gap: 6px; align-items: center;">
              <select id="status-select-${o.id}" class="form-input" style="padding: 4px 8px; font-size: 0.8rem; width: auto; height: 32px;">
                <option value="PLACED" ${o.status === 'PLACED' ? 'selected' : ''}>PLACED</option>
                <option value="CONFIRMED" ${o.status === 'CONFIRMED' ? 'selected' : ''}>CONFIRMED</option>
                <option value="PROCESSING" ${o.status === 'PROCESSING' ? 'selected' : ''}>PROCESSING</option>
                <option value="SHIPPED" ${o.status === 'SHIPPED' ? 'selected' : ''}>SHIPPED</option>
                <option value="OUT_FOR_DELIVERY" ${o.status === 'OUT_FOR_DELIVERY' ? 'selected' : ''}>OUT_FOR_DELIVERY</option>
                <option value="DELIVERED" ${o.status === 'DELIVERED' ? 'selected' : ''}>DELIVERED</option>
                <option value="CANCELLED" ${o.status === 'CANCELLED' ? 'selected' : ''}>CANCELLED</option>
              </select>
              <button class="btn btn-secondary btn-sm" style="padding: 4px 10px; height: 32px;" onclick="window.smUpdateStatus(${o.id})">
                Save
              </button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    function getStatusColorClass(status) {
      switch (status) {
        case "DELIVERED": return "success";
        case "SHIPPED":
        case "OUT_FOR_DELIVERY": return "cyan";
        case "PROCESSING":
        case "CONFIRMED": return "purple";
        case "CANCELLED": return "danger";
        default: return "warning";
      }
    }

    window.smUpdateStatus = async function(orderId) {
      const select = document.getElementById(`status-select-${orderId}`);
      if (!select) return;
      const newStatus = select.value;
      try {
        await seller.updateOrderStatus(orderId, newStatus);
        const targetOrder = allOrders.find(o => o.id === orderId);
        if (targetOrder) targetOrder.status = newStatus;
        renderFilteredOrders();
      } catch (err) {
        // handled in toast
      }
    };

    // Filter Buttons
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => {
          b.classList.remove("btn-primary");
          b.classList.add("btn-outline");
        });
        btn.classList.remove("btn-outline");
        btn.classList.add("btn-primary");
        currentFilter = btn.dataset.status;
        renderFilteredOrders();
      });
    });

    loadOrders();
  </script>
</body>
</html>
