<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Wishlist - StyleMirror</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/ecommerce.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div id="site-header-container"></div>

  <main class="main-content">
    <div class="container">
      <div style="margin-bottom: 32px;">
        <span class="product-brand">CURATED PREFERENCES</span>
        <h1 class="display-title" style="font-size: 2.2rem;">SAVED <span class="gold-text">WISHLIST</span></h1>
      </div>

      <div id="wishlist-grid-container" class="product-grid">
        <div class="loading-spinner"></div>
      </div>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <script type="module">
    import { wishlist } from "/js/wishlist.js";
    import { products } from "/js/products.js";
    import { auth } from "/js/auth.js";
    import "/js/app.js";

    async function loadWishlistPage() {
      const container = document.getElementById("wishlist-grid-container");

      if (!auth.isLoggedIn()) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state-icon">🔒</div>
            <h3>Please Sign In</h3>
            <p>Sign in to view your saved fashion wishlist.</p>
            <a href="/pages/login.html" class="btn btn-primary" style="margin-top: 16px;">Sign In</a>
          </div>
        `;
        return;
      }

      try {
        const wData = await wishlist.getWishlist();
        if (!wData || !wData.products || wData.products.length === 0) {
          container.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <div class="empty-state-icon">♥</div>
              <h3>Your wishlist is currently empty</h3>
              <p>Explore garments in the atelier and click the heart icon to save favorites.</p>
              <a href="/pages/products.html" class="btn btn-primary" style="margin-top: 16px;">Explore Collection</a>
            </div>
          `;
          return;
        }

        container.innerHTML = wData.products.map(p => products.renderProductCard(p)).join("");
      } catch (err) {
        container.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">Error: ${err.message}</div>`;
      }
    }

    loadWishlistPage();
  </script>
</body>
</html>
