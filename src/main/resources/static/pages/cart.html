<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Bag - StyleMirror</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/ecommerce.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div id="site-header-container"></div>

  <main class="main-content">
    <div class="container">
      <div style="margin-bottom: 32px;">
        <span class="product-brand">ORDER CART REVIEW</span>
        <h1 class="display-title" style="font-size: 2.2rem;">SHOPPING <span class="gold-text">BAG</span></h1>
      </div>

      <div id="cart-content-container">
        <div class="loading-spinner"></div>
      </div>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <script type="module">
    import { cart } from "/js/cart.js";
    import { auth } from "/js/auth.js";
    import { utils } from "/js/utils.js";
    import "/js/app.js";

    async function loadCartPage() {
      const container = document.getElementById("cart-content-container");

      if (!auth.isLoggedIn()) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🔒</div>
            <h3>Please Sign In</h3>
            <p>Sign in to view items added to your shopping bag.</p>
            <a href="/pages/login.html" class="btn btn-primary" style="margin-top: 16px;">Sign In</a>
          </div>
        `;
        return;
      }

      try {
        const cartData = await cart.getCart();

        if (!cartData || !cartData.items || cartData.items.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">🛍️</div>
              <h3>Your shopping bag is empty</h3>
              <p>Discover luxury garments in the digital atelier catalog.</p>
              <a href="/pages/products.html" class="btn btn-primary" style="margin-top: 16px;">Explore Collection</a>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <div class="cart-grid">
            <!-- Left: Items Table -->
            <div class="card" style="padding: 0; overflow: hidden;">
              <table class="cart-table">
                <thead>
                  <tr>
                    <th>Garment</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  ${cartData.items.map(item => `
                    <tr>
                      <td>
                        <div class="cart-item-row">
                          <img src="${item.imageUrl}" alt="${item.productName}" class="cart-item-thumb" />
                          <div>
                            <span class="product-brand">${item.brand}</span>
                            <div style="font-weight: 600;">${item.productName}</div>
                            <div style="font-size: 0.8rem; color: var(--text-dim);">Size: ${item.size} | Color: ${item.color}</div>
                          </div>
                        </div>
                      </td>
                      <td>${utils.formatCurrency(item.unitPrice)}</td>
                      <td>
                        <div class="qty-stepper">
                          <button class="qty-btn" onclick="window.changeQty(${item.id}, ${item.quantity - 1})">-</button>
                          <span class="qty-val">${item.quantity}</span>
                          <button class="qty-btn" onclick="window.changeQty(${item.id}, ${item.quantity + 1})" ${item.quantity >= item.availableStock ? "disabled title='Stock limit reached'" : ""}>+</button>
                        </div>
                      </td>
                      <td style="font-weight: 700; color: var(--accent-gold);">${utils.formatCurrency(item.subtotal)}</td>
                      <td>
                        <button class="btn btn-danger btn-sm" onclick="window.deleteItem(${item.id})">Remove</button>
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
              <div style="padding: 16px 20px; display: flex; justify-content: space-between; background: var(--bg-secondary);">
                <a href="/pages/products.html" class="btn btn-outline btn-sm">&larr; Continue Shopping</a>
                <button class="btn btn-outline btn-sm" onclick="window.clearAllCart()">Clear Bag</button>
              </div>
            </div>

            <!-- Right: Order Summary -->
            <div class="order-summary-card">
              <h3 style="font-size: 1.2rem; margin-bottom: 20px;">Order Summary</h3>
              <div class="summary-row">
                <span>Items Subtotal (${cartData.totalItems})</span>
                <span>${utils.formatCurrency(cartData.subtotal)}</span>
              </div>
              <div class="summary-row">
                <span>Estimated Sales Tax (8%)</span>
                <span>${utils.formatCurrency(cartData.estimatedTax)}</span>
              </div>
              <div class="summary-row">
                <span>Express Insured Shipping</span>
                <span>${cartData.shippingFee > 0 ? utils.formatCurrency(cartData.shippingFee) : "FREE"}</span>
              </div>
              <div class="summary-row total">
                <span>Estimated Total</span>
                <span class="gold-text">${utils.formatCurrency(cartData.grandTotal)}</span>
              </div>
              <a href="/pages/checkout.html" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 24px;">
                Proceed to Checkout &rarr;
              </a>
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="empty-state">Error loading cart: ${err.message}</div>`;
      }
    }

    window.changeQty = async function(itemId, newQty) {
      try {
        await cart.updateQuantity(itemId, newQty);
        loadCartPage();
      } catch (err) {
        // Handled
      }
    };

    window.deleteItem = async function(itemId) {
      try {
        await cart.removeItem(itemId);
        loadCartPage();
      } catch (err) {
        // Handled
      }
    };

    window.clearAllCart = async function() {
      if (confirm("Empty your entire shopping bag?")) {
        await cart.clearCart();
        loadCartPage();
      }
    };

    loadCartPage();
  </script>
</body>
</html>
