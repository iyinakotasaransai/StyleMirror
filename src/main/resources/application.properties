# ==============================================================
# StyleMirror Spring Boot Application Properties
# ==============================================================

spring.application.name=stylemirror
server.port=${SERVER_PORT:8080}

# Database Connection (MySQL 8.x)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stylemirror}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:MyNewPass123!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.enabled=true

# Static Resource Handling (Frontend served from resources/static + uploads mapped)
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# JWT Configuration
app.jwt.secret=${JWT_SECRET:StyleMirrorSuperSecureSecretKeyForBTechFinalYearProject2026StyleMirrorSecureToken}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Google Gemini API Configuration (Backend-only)
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
app.gemini.rate-limit-per-minute=10

# File Storage Configuration
app.upload.dir=${UPLOAD_DIRECTORY:uploads}

# Logging
logging.level.root=INFO
logging.level.com.stylemirror=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
